name: smartbank
services:
  accountsdb:
    container_name: accountsdb
    ports:
      - 3306:3306
    volumes:
      - D:\SmartBanks\smartbank\accountsdata:/var/lib/mysql
    environment:
      MYSQL_DATABASE: accountsdb
    extends:
      file: common-config.yml
      service: microservice-db-config

  loansdb:
    container_name: loansdb
    ports:
      - 3307:3306
    volumes:
      - D:\SmartBanks\smartbank\loansdata:/var/lib/mysql
    environment:
      MYSQL_DATABASE: loansdb
    extends:
      file: common-config.yml
      service: microservice-db-config

  cardsdb:
    container_name: cardsdb
    ports:
      - 3308:3306
    volumes:
      - D:\SmartBanks\smartbank\cardsdata:/var/lib/mysql
    environment:
      MYSQL_DATABASE: cardsdb
    extends:
      file: common-config.yml
      service: microservice-db-config

  rabbit:
    image: rabbitmq:4-management
    hostname: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: rabbitmq-diagnostics check_port_connectivity
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    extends:
      file: common-config.yml
      service: network-deploy-service

  configserver:
    image: "starxcoder/configserver:v2"
    container_name: configserver-ms
    ports:
      - "8071:8071"
    depends_on:
      rabbit:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8071/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    environment:
      SPRING_CLOUD_CONFIG_SERVER_GIT_USERNAME: ${CONFIG_GIT_USERNAME}
      SPRING_CLOUD_CONFIG_SERVER_GIT_PASSWORD: ${CONFIG_GIT_PASSWORD}
    extends:
      file: common-config.yml
      service: microservice-base-config

  eurekaserver:
    image: "starxcoder/eurekaserver:v1"
    container_name: eurekaserver-ms
    ports:
      - "8070:8070"
    depends_on:
      configserver:
        condition: service_healthy
    healthcheck:
      test: "curl --fail --silent localhost:8070/actuator/health/readiness | grep UP || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    extends:
      file: common-config.yml
      service: microservice-configserver-config
    environment:
      SPRING_APPLICATION_NAME: "eurekaserver"

  accounts:
    image: "starxcoder/accounts:v3"
    container_name: accounts-ms
    ports:
      - "8080:8080"

    deploy:
      resources:
        limits:
          memory: 1G

    depends_on:
      accountsdb:
        condition: service_healthy
      configserver:
        condition: service_healthy

    environment:
      SPRING_APPLICATION_NAME: "accounts"
      SPRING_DATASOURCE_URL: "jdbc:mysql://accountsdb:3306/accountsdb"

      BPL_JVM_THREAD_COUNT: "50"

    extends:
      file: common-config.yml
      service: microservice-configserver-config

  loans:
    image: "starxcoder/loans:v2"
    container_name: loans-ms
    ports:
      - "8090:8090"

    deploy:
      resources:
        limits:
          memory: 1G

    depends_on:
      loansdb:
        condition: service_healthy
      configserver:
        condition: service_healthy

    environment:
      SPRING_APPLICATION_NAME: "loans"
      SPRING_DATASOURCE_URL: "jdbc:mysql://loansdb:3306/loansdb"

      BPL_JVM_THREAD_COUNT: "50"

    extends:
      file: common-config.yml
      service: microservice-configserver-config

  cards:
    image: "starxcoder/cards:v2"
    container_name: cards-ms
    ports:
      - "9000:9000"

    deploy:
      resources:
        limits:
          memory: 1G

    depends_on:
      cardsdb:
        condition: service_healthy
      configserver:
        condition: service_healthy

    environment:
      SPRING_APPLICATION_NAME: "cards"
      SPRING_DATASOURCE_URL: "jdbc:mysql://cardsdb:3306/cardsdb"

      BPL_JVM_THREAD_COUNT: "50"

    extends:
      file: common-config.yml
      service: microservice-configserver-config

networks:
  smartbank:
    driver: "bridge"